<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciativa Resgate Animal</title>
    
    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- CSS Próprio -->
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body class="bg-light">

    <!-- Container estilo Mobile / Linktree -->
    <div class="container py-4" style="max-width: 500px;">
        
        <!-- Cabeçalho Principal (Perfil) -->
        <div class="text-center mb-4">
            <img src="{{ url_for('static', path='/img/logo_resgate.jpeg') }}" 
     alt="Adoção de Pets Salvador" 
     class="rounded-circle shadow mb-3 logo-perfil" 
     style="width: 120px; height: 120px; object-fit: cover;">
<h1 class="h4 fw-bold mb-1 text-dark">Adoção de Pets</h1>
<p class="text-muted small">Salvador - BA 🐾</p>
            <h1 class="h4 fw-bold mb-1">Resgate & Adoção</h1>
            <p class="text-muted small">Cuidando e encontrando lares cheios de amor 🐾</p>
        </div>

        <!-- CONTEÚDO DINÂMICO DAS OUTRAS PÁGINAS -->
        {% block content %}
        {% endblock %}

        <!-- Rodapé simples -->
        <footer class="text-center mt-5 text-muted small">
            <p>© 2026 Resgate Animal • Feito com ❤️</p>
        </footer>

    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
